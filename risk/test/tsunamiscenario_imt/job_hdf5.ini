[general]
description = Scenario risk demo  (Catania Tsunami) with hdf5 input for hazard
calculation_mode = scenario_risk
concurrent_tasks = 16
ses_seed = 42

[exposure]
exposure_file = exposure_model.xml

[vulnerability]
structural_vulnerability_file = vulnerability_model.xml

[hazard sites]
gmfs_file = tsunami_scenario.hdf5
asset_hazard_distance = 0.01 #10m

[risk_calculation]
time_event = night
asset_correlation = 0

[export]
export_dir = /tmp