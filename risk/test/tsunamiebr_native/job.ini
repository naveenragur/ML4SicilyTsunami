[general]
description = Native OQ-Tsunami event-based risk demo using FLOWDEPTH imported GMFs and postrisk AAL/EP integration
calculation_mode = event_based_risk
concurrent_tasks = 24
ses_seed = 42

[exposure]
exposure_file = exposure_model.xml

[vulnerability]
structural_vulnerability_file = vulnerability_model.xml

[hazard sites]
gmfs_file = tsunami_hazard.hdf5
asset_hazard_distance = 0.01 #10m

[risk_calculation]
time_event = night
asset_correlation = 0
aggregate_by = Construction
return_periods = 50 100 200 500 1000 10000 100000 500000 1000000 5000000 10000000 50000000 100000000
postrisk_func = tsunami.main
postrisk_args = {'event_rates_file': 'event_rates.csv','plot': True}

[export]
export_dir = /mnt/beegfs/nragu/tsunami/ML4SicilyTsunami/risk/demos/tsunamiebr_native/oq_tsunami_outputs/
