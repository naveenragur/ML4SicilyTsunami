[general]
description = Native OQ event-based risk using FLOWDEPTH imported GMFs (529_sigmaplus) and tsunami.main AAL/EP integration
calculation_mode = event_based_risk
concurrent_tasks = 16
ses_seed = 42

[exposure]
exposure_file = ../exposure/oq_inputs/exposure_model.xml

[vulnerability]
structural_vulnerability_file = ../vulnerability/oq_inputs/vulnerability_model_cm.xml

[hazard sites]
gmfs_file = ../hazard/oq_inputs/tsunami_prob_529_sigmaplus.hdf5
asset_hazard_distance = 0.01 #10m in degrees, ~1km at the equator

[risk_calculation]
time_event = night
asset_correlation = 0
aggregate_by = id
return_periods = 1000 2000 5000 10000 20000 50000 100000 200000 2000000 5000000 10000000 20000000 50000000 100000000 200000000 500000000 1000000000
postrisk_func = tsunami.main
postrisk_args = {'event_rates_file': '../hazard/oq_inputs/event_rate_samples.csv','plot': True,'plot_loss_ratio': True}

[export]
export_dir = ../tmp/529/sigmaplus
