[general]
description = Scenario Risk Demo (Catania Tsunami) using emulation results with training size 1658 mean minus 2 sigma with Foglio as aggregation and cm vulnerability model
calculation_mode = event_based_risk
concurrent_tasks = 24
ses_seed = 42

[exposure]
exposure_file = exposure_model.xml

[vulnerability]
structural_vulnerability_file = vulnerability_model_cm.xml

[hazard sites]
gmfs_file = tsunami_prob_1658_sigmaminus.hdf5
asset_hazard_distance = 0.01 #10m

[risk_calculation]
time_event = night
asset_correlation = 0
aggregate_by = Foglio

[export]
export_dir = /tmp
